<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>金光布袋戲 Q版江湖抽卡</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts: Ma Shan Zheng (Calligraphy) & Noto Serif TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Noto Serif TC', serif;
      background-color: #0b0c10;
      color: #e0e0e0;
      overflow-x: hidden;
      user-select: none;
    }
    
    .font-calligraphy {
      font-family: 'Ma Shan Zheng', cursive;
    }

    /* Ink & Chinese Wuxia background styling */
    .wuxia-bg {
      background: radial-gradient(circle at center, rgba(30,20,50,0.8) 0%, rgba(5,5,12,0.95) 100%),
                  url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1600&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      background-blend-mode: overlay;
    }

    /* Card Glows by Rarity */
    .glow-s {
      box-shadow: 0 0 15px #3b82f6, 0 0 30px #1d4ed8, inset 0 0 10px #60a5fa;
      border: 2px solid #60a5fa;
    }
    .glow-sr {
      box-shadow: 0 0 20px #eab308, 0 0 40px #ca8a04, inset 0 0 15px #fef08a;
      border: 2px solid #fde047;
    }
    .glow-ssr {
      box-shadow: 0 0 25px #ec4899, 0 0 50px #8b5cf6, 0 0 75px #3b82f6, inset 0 0 20px #f43f5e;
      border: 2px solid #f472b6;
      animation: rainbowGlow 3s infinite linear;
    }

    @keyframes rainbowGlow {
      0% { filter: hue-rotate(0deg); }
      100% { filter: hue-rotate(360deg); }
    }

    /* Rainbow Text for SSR */
    .text-ssr {
      background: linear-gradient(45deg, #ff0055, #ffcc00, #00ffcc, #0099ff, #ff00ff);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: rainbowShift 3s ease infinite;
    }
    @keyframes rainbowShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Scroll aesthetic */
    .scroll-border {
      border-image: linear-gradient(to bottom, #d4af37, #8b5a2b, #d4af37) 1;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #111827;
    }
    ::-webkit-scrollbar-thumb {
      background: #8b5a2b;
      border-radius: 4px;
    }

    /* Downward Pull Animation Base */
    .pull-card-container {
      perspective: 1000px;
    }

    /* Shake Animation for Pull Interaction */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
    }
    .pulse-glow {
      animation: pulseGlow 2s infinite;
    }

    /* Rays & Aura Effects */
    .ray-s { background: radial-gradient(circle, rgba(59,130,246,0.5) 0%, rgba(0,0,0,0) 70%); }
    .ray-sr { background: radial-gradient(circle, rgba(234,179,8,0.6) 0%, rgba(0,0,0,0) 70%); }
    .ray-ssr { background: radial-gradient(circle, rgba(236,72,153,0.8) 0%, rgba(139,92,246,0.4) 40%, rgba(0,0,0,0) 80%); }

    /* Canvas Effect Layer */
    #fxCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 50;
    }
  </style>
</head>
<body class="wuxia-bg min-h-screen flex flex-col justify-between relative overflow-x-hidden">

  <!-- Effect Canvas for SSR/SR/S Particles -->
  <canvas id="fxCanvas"></canvas>

  <!-- Top Navigation Header -->
  <header class="w-full px-4 py-3 bg-slate-950/80 backdrop-blur-md border-b border-amber-900/50 flex justify-between items-center z-20 shadow-lg">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-full bg-amber-800/40 border border-amber-500/60 flex items-center justify-center text-amber-400 font-bold text-xl shadow-inner">
        金
      </div>
      <div>
        <h1 class="text-xl md:text-2xl font-bold font-calligraphy text-amber-400 tracking-wider">金光武林‧Q版神州錄</h1>
        <p class="text-xs text-amber-200/60">試鋒芒 ‧ 召喚絕世英雄</p>
      </div>
    </div>
    
    <!-- Gallery/Collection Button -->
    <button id="openGalleryBtn" class="px-4 py-2 bg-gradient-to-r from-amber-800 to-amber-950 hover:from-amber-700 hover:to-amber-900 border border-amber-500/50 rounded-lg text-amber-200 flex items-center gap-2 transition duration-300 shadow-md hover:scale-105 active:scale-95">
      <i class="fa-solid font-bold fa-book-skull text-amber-400"></i>
      <span class="font-bold">英雄圖鑑</span>
      <span id="galleryCountBadge" class="bg-amber-500/30 text-amber-300 text-xs px-2 py-0.5 rounded-full border border-amber-400/40">0/22</span>
    </button>
  </header>

  <!-- Main Interactive Area -->
  <main class="flex-1 flex flex-col items-center justify-center p-4 relative z-10 my-2">
    
    <!-- Title Banner -->
    <div class="text-center mb-6 relative">
      <div class="inline-block px-8 py-2 bg-slate-900/80 border-y-2 border-amber-600/60 rounded-lg backdrop-blur-sm relative shadow-2xl">
        <span class="absolute -left-2 -top-2 text-amber-500 text-xl"><i class="fa-solid fa-dragon"></i></span>
        <span class="absolute -right-2 -bottom-2 text-amber-500 text-xl"><i class="fa-solid fa-dragon transform -scale-x-100"></i></span>
        <h2 class="text-2xl md:text-4xl font-extrabold font-calligraphy text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-amber-400 to-yellow-500 tracking-widest drop-shadow-md">
          江湖靈陣 ‧ 免費祈願
        </h2>
      </div>
      <p class="text-amber-300/70 text-xs md:text-sm mt-2">
        <span class="inline-block px-2 py-0.5 bg-blue-900/40 border border-blue-500/40 rounded text-blue-300 mr-1">S 60%</span>
        <span class="inline-block px-2 py-0.5 bg-yellow-900/40 border border-yellow-500/40 rounded text-yellow-300 mr-1">SR 30%</span>
        <span class="inline-block px-2 py-0.5 bg-pink-900/40 border border-pink-500/40 rounded text-pink-300">SSR 10%</span>
      </p>
    </div>

    <!-- Shrine / Card Altar Display -->
    <div class="relative w-full max-w-sm h-80 md:h-96 flex items-center justify-center my-2">
      <!-- Magic Circle Background Effect -->
      <div class="absolute w-72 h-72 md:w-80 md:h-80 rounded-full border-2 border-amber-500/20 flex items-center justify-center animate-[spin_20s_linear_infinite] pointer-events-none">
        <div class="w-56 h-56 rounded-full border border-dashed border-amber-400/30"></div>
      </div>
      
      <!-- Card Deck/Altar Graphic (Cover Card) -->
      <div id="deckAltar" class="relative w-48 h-72 md:w-56 md:h-80 bg-gradient-to-b from-slate-900 via-stone-900 to-black rounded-xl border-2 border-amber-600/80 shadow-2xl flex flex-col items-center justify-between p-4 cursor-pointer transform hover:scale-105 transition duration-300 group">
        
        <!-- Top Scroll Detail -->
        <div class="w-full border-b border-amber-700/50 pb-2 flex justify-between items-center text-amber-500 text-xs">
          <i class="fa-solid fa-yin-yang text-base animate-spin"></i>
          <span class="font-calligraphy text-sm tracking-widest">金光秘典</span>
          <i class="fa-solid fa-yin-yang text-base animate-spin"></i>
        </div>

        <!-- Center Emblem -->
        <div class="flex-1 flex flex-col items-center justify-center my-2">
          <div class="w-24 h-24 rounded-full bg-gradient-to-tr from-amber-950 to-slate-900 border-2 border-amber-500/60 flex items-center justify-center shadow-inner relative group-hover:border-amber-400 transition">
            <i class="fa-solid fa-scroll text-4xl text-amber-500/80 group-hover:text-amber-300 transition group-hover:scale-110 duration-300"></i>
            <div class="absolute inset-0 rounded-full bg-amber-500/10 animate-ping"></div>
          </div>
          <span class="mt-4 text-xs text-amber-300/80 tracking-widest font-bold">按住向下拉取靈卡</span>
        </div>

        <!-- Downward Drag Cue -->
        <div class="w-full pt-2 border-t border-amber-700/50 flex flex-col items-center text-amber-400 animate-bounce">
          <i class="fa-solid fa-angles-down text-lg"></i>
          <span class="text-[10px] text-amber-200/60">PULL DOWN</span>
        </div>
      </div>
    </div>

    <!-- Draw Buttons -->
    <div class="flex flex-row gap-4 mt-6 w-full max-w-xs md:max-w-md justify-center">
      <!-- Single Draw Button -->
      <button id="drawOneBtn" class="flex-1 py-3 px-4 bg-gradient-to-r from-amber-700 via-amber-600 to-amber-800 hover:from-amber-600 hover:to-amber-700 border-2 border-amber-400/80 rounded-xl text-amber-100 font-bold text-base md:text-lg shadow-lg hover:shadow-amber-500/20 transform hover:-translate-y-0.5 active:translate-y-0.5 transition flex flex-col items-center justify-center">
        <span class="font-calligraphy tracking-wider"><i class="fa-solid fa-wand-magic-sparkles mr-1"></i> 單回祈願</span>
        <span class="text-[10px] font-normal text-amber-200/80">免費抽取 1 次</span>
      </button>

      <!-- 10x Draw Button -->
      <button id="drawTenBtn" class="flex-1 py-3 px-4 bg-gradient-to-r from-purple-800 via-indigo-800 to-purple-900 hover:from-purple-700 hover:to-indigo-700 border-2 border-purple-400/80 rounded-xl text-purple-100 font-bold text-base md:text-lg shadow-lg hover:shadow-purple-500/20 transform hover:-translate-y-0.5 active:translate-y-0.5 transition flex flex-col items-center justify-center">
        <span class="font-calligraphy tracking-wider text-yellow-300"><i class="fa-solid fa-burst mr-1"></i> 十連祈願</span>
        <span class="text-[10px] font-normal text-purple-200/80">免費連抽 10 次</span>
      </button>
    </div>
  </main>

  <!-- Footer -->
  <footer class="w-full py-2 text-center text-xs text-amber-200/40 bg-slate-950/90 border-t border-amber-900/30 z-10">
    金光布袋戲 Q版角色粉絲創作同人抽卡體驗 ‧ 祝您喜提 SSR 絕世英雄！
  </footer>

  <!-- Interactive Downward Pull Animation Overlay / Modal -->
  <div id="pullStageModal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-lg flex flex-col items-center justify-center z-50 hidden opacity-0 transition-opacity duration-300">
    
    <!-- Top Hint & Close -->
    <div class="absolute top-6 w-full px-6 flex justify-between items-center text-amber-200 z-10">
      <div class="text-sm font-calligraphy text-amber-400"><i class="fa-solid fa-compass mr-1"></i> 拖曳滑動下抽取牌</div>
      <button id="cancelPullBtn" class="text-slate-400 hover:text-white text-2xl p-2"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <div class="text-center mb-4">
      <h3 id="pullStageTitle" class="text-2xl font-bold font-calligraphy text-amber-300">感應天機 ‧ 凝神抽牌</h3>
      <p class="text-xs text-slate-400 mt-1">請按住卡牌，往下拉動開牌！</p>
    </div>

    <!-- Pull Down Target Zone -->
    <div id="pullDropArea" class="relative w-64 h-96 border-2 border-dashed border-amber-500/30 rounded-2xl flex flex-col items-center justify-between p-4 overflow-hidden shadow-2xl bg-slate-900/50">
      
      <!-- Top Slot Indicator -->
      <div class="text-amber-500/40 text-xs tracking-widest font-mono">── 卡匣頂部 ──</div>

      <!-- Draggable Card Back -->
      <div id="draggableCard" class="absolute top-4 w-52 h-80 bg-gradient-to-b from-stone-900 via-amber-950 to-slate-950 rounded-xl border-2 border-amber-500 shadow-2xl flex flex-col items-center justify-between p-4 cursor-grab active:cursor-grabbing transition-transform touch-none select-none z-20">
        <div class="w-full flex justify-between text-amber-500 text-xs">
          <i class="fa-solid fa-sun"></i>
          <span class="font-calligraphy">金光陣</span>
          <i class="fa-solid fa-moon"></i>
        </div>

        <div class="my-auto text-center">
          <div class="w-20 h-20 rounded-full border-2 border-amber-500/60 bg-black/50 flex items-center justify-center mx-auto mb-2 shadow-inner">
            <i class="fa-solid fa-hand-pointer text-2xl text-amber-400 animate-pulse"></i>
          </div>
          <p class="text-amber-300 text-xs font-bold font-calligraphy">向下拖拽揭曉</p>
        </div>

        <!-- Pull Arrow indicator -->
        <div class="w-full text-center text-amber-400 animate-bounce">
          <i class="fa-solid fa-chevron-down text-xl"></i>
        </div>
      </div>

      <!-- Bottom Target Marker -->
      <div class="mt-auto text-amber-500/50 text-xs flex flex-col items-center gap-1 mb-2">
        <i class="fa-solid fa-angles-down text-amber-400/80 animate-ping"></i>
        <span class="font-mono text-[10px]">拉至此處解封</span>
      </div>
    </div>

    <!-- Quick Trigger Button fallback for accessibility -->
    <button id="quickPullBtn" class="mt-6 px-6 py-2 bg-amber-700/60 hover:bg-amber-600/80 border border-amber-400/60 rounded-full text-amber-200 text-xs font-bold transition">
      直接觸發抽取 <i class="fa-solid fa-arrow-down ml-1"></i>
    </button>
  </div>

  <!-- Single Card Reveal Display Modal -->
  <div id="singleRevealModal" class="fixed inset-0 bg-black/95 flex flex-col items-center justify-center z-50 hidden">
    <!-- Aura Rays Layer -->
    <div id="revealAura" class="absolute w-[600px] h-[600px] rounded-full pointer-events-none transition-all duration-700 opacity-80"></div>

    <div class="relative z-10 flex flex-col items-center max-w-sm w-full px-4">
      
      <!-- Reveal Rarity Title -->
      <div id="revealRarityBadge" class="mb-4 text-3xl md:text-4xl font-extrabold tracking-widest font-calligraphy drop-shadow-lg">
        <!-- JS fills SSR / SR / S -->
      </div>

      <!-- Card Object -->
      <div id="revealedCard" class="w-64 h-96 rounded-2xl p-4 flex flex-col items-center justify-between relative bg-slate-900 border-4 transform transition-all duration-500 scale-95 shadow-2xl overflow-hidden">
        
        <!-- Card Background Watermark/Pattern -->
        <div class="absolute inset-0 bg-[radial-gradient(#ffffff0a_1px,transparent_1px)] [background-size:16px_16px] pointer-events-none"></div>

        <!-- Card Header: Title & Rarity -->
        <div class="w-full flex justify-between items-center z-10 border-b border-white/20 pb-2">
          <span id="cardRarityTag" class="px-2.5 py-0.5 rounded text-xs font-black tracking-wider shadow"></span>
          <span class="text-xs text-slate-300 font-calligraphy">金光神州</span>
        </div>

        <!-- Card Q-Version Avatar Canvas/SVG Render Container -->
        <div id="cardAvatarBox" class="w-40 h-40 rounded-full my-auto flex items-center justify-center relative z-10 shadow-inner overflow-hidden border-2 border-white/20">
          <!-- SVG avatar rendered via JS -->
        </div>

        <!-- Card Footer: Name & Quote -->
        <div class="w-full text-center z-10 pt-2 border-t border-white/20 bg-black/40 rounded-b-xl px-2">
          <h3 id="cardHeroName" class="text-2xl font-bold font-calligraphy tracking-widest text-white drop-shadow"></h3>
          <p id="cardHeroQuote" class="text-[11px] text-amber-200/80 italic mt-0.5 font-serif line-clamp-1"></p>
        </div>
      </div>

      <!-- Confirm / Next Button -->
      <button id="closeRevealBtn" class="mt-8 px-8 py-3 bg-gradient-to-r from-amber-600 to-amber-800 border-2 border-amber-300 rounded-full text-amber-100 font-bold font-calligraphy tracking-wider hover:scale-105 active:scale-95 transition shadow-lg shadow-amber-900/50">
        收下英雄 <i class="fa-solid fa-check ml-1"></i>
      </button>
    </div>
  </div>

  <!-- Ten Draws Grid Result Modal -->
  <div id="tenRevealModal" class="fixed inset-0 bg-slate-950/95 backdrop-blur-xl flex flex-col items-center justify-between p-4 md:p-6 z-50 hidden overflow-y-auto">
    
    <div class="text-center mt-2">
      <h2 class="text-3xl font-extrabold font-calligraphy text-amber-400 tracking-widest">十連豪氣祈願</h2>
      <p class="text-xs text-amber-200/70 mt-1">群雄並起 ‧ 點擊卡牌可放大檢視</p>
    </div>

    <!-- 10 Cards Grid (5x2 on desktop, responsive) -->
    <div id="tenCardsGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3 md:gap-4 my-4 w-full max-w-5xl justify-items-center">
      <!-- Cards injected by JS -->
    </div>

    <!-- Bottom Actions -->
    <div class="mb-4 flex gap-4">
      <button id="drawTenAgainBtn" class="px-6 py-2.5 bg-gradient-to-r from-purple-800 to-indigo-800 border border-purple-400 rounded-xl text-amber-200 font-bold font-calligraphy hover:scale-105 transition shadow-lg">
        再抽十次 <i class="fa-solid fa-rotate-right ml-1"></i>
      </button>
      <button id="closeTenBtn" class="px-6 py-2.5 bg-gradient-to-r from-amber-700 to-amber-900 border border-amber-400 rounded-xl text-amber-100 font-bold font-calligraphy hover:scale-105 transition shadow-lg">
        收下全部 <i class="fa-solid fa-box-archive ml-1"></i>
      </button>
    </div>
  </div>

  <!-- Hero Collection Gallery Modal -->
  <div id="galleryModal" class="fixed inset-0 bg-slate-950/95 backdrop-blur-xl flex flex-col z-50 hidden">
    <!-- Gallery Header -->
    <div class="p-4 bg-slate-900/90 border-b border-amber-900/50 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <i class="fa-solid fa-book-journal-whills text-2xl text-amber-400"></i>
        <div>
          <h2 class="text-xl font-bold font-calligraphy text-amber-300">金光英雄譜 (已收集 <span id="collectedCountText">0</span>/22)</h2>
          <p class="text-xs text-slate-400">點擊卡牌點亮圖鑑與查看獲得次數</p>
        </div>
      </div>
      <button id="closeGalleryBtn" class="text-slate-400 hover:text-white text-2xl p-2"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <!-- Gallery Tabs -->
    <div class="flex border-b border-slate-800 bg-slate-950 px-4 pt-2 gap-2 text-xs md:text-sm">
      <button class="gallery-tab active-tab px-4 py-2 font-bold text-amber-400 border-b-2 border-amber-400" data-filter="ALL">全部</button>
      <button class="gallery-tab px-4 py-2 font-bold text-slate-400 hover:text-pink-400" data-filter="SSR">SSR (七彩)</button>
      <button class="gallery-tab px-4 py-2 font-bold text-slate-400 hover:text-yellow-400" data-filter="SR">SR (金色)</button>
      <button class="gallery-tab px-4 py-2 font-bold text-slate-400 hover:text-blue-400" data-filter="S">S (亮藍)</button>
    </div>

    <!-- Gallery Grid Area -->
    <div id="galleryGrid" class="flex-1 p-4 md:p-6 grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4 overflow-y-auto">
      <!-- JS generates collection cards here -->
    </div>
  </div>

  <script>
    /* =========================================================================
       1. CHARACTER DATASET & RARITIES
       ========================================================================= */
    const HEROES = [
      // SSR (8 Characters)
      { id: 'ssr_1', name: '元邪皇', rarity: 'SSR', bg: '#4a0e17', quote: '千年執念，燭龍再臨！', color: '#ff2a6d', hair: '#1a1a1a', eyes: '#ff0055', accent: '#880022' },
      { id: 'ssr_2', name: '缺舟一帆渡', rarity: 'SSR', bg: '#1c2541', quote: '千年回眸，百態皆空。', color: '#00f5d4', hair: '#ffffff', eyes: '#00bbf9', accent: '#3a86ff' },
      { id: 'ssr_3', name: '默蒼離', rarity: 'SSR', bg: '#0b090a', quote: '講完這句話，你就可以死了。', color: '#70e000', hair: '#333333', eyes: '#38b000', accent: '#007200' },
      { id: 'ssr_4', name: '雁王', rarity: 'SSR', bg: '#2b1e3a', quote: '聰明人，最容易走入死局。', color: '#f72585', hair: '#4a4e69', eyes: '#7209b7', accent: '#4361ee' },
      { id: 'ssr_5', name: '史豔文', rarity: 'SSR', bg: '#2c1020', quote: '純陽貫地，正氣凌霄！', color: '#fee440', hair: '#ffffff', eyes: '#00bbf9', accent: '#ffb703' },
      { id: 'ssr_6', name: '藏鏡人', rarity: 'SSR', bg: '#3a0ca3', quote: '順我者生，逆我者亡！', color: '#f72585', hair: '#ffb703', eyes: '#4cc9f0', accent: '#7209b7' },
      { id: 'ssr_7', name: '俏如來', rarity: 'SSR', bg: '#1a1c23', quote: '止戈流 ‧ 開陣！', color: '#4895ef', hair: '#ffffff', eyes: '#4361ee', accent: '#3f37c9' },
      { id: 'ssr_8', name: '玄狐', rarity: 'SSR', bg: '#1982c4', quote: '斬武道，只求一敗！', color: '#ff595e', hair: '#1d3557', eyes: '#ff595e', accent: '#6a4c93' },

      // SR (7 Characters)
      { id: 'sr_1', name: '黑白郎君', rarity: 'SR', bg: '#111111', quote: '別人的失敗，就是我的快樂啦！', color: '#eab308', hair: '#ffffff', eyes: '#eab308', accent: '#000000' },
      { id: 'sr_2', name: '任飄渺', rarity: 'SR', bg: '#1e293b', quote: '劍十五 ‧ 隨風去。', color: '#f59e0b', hair: '#64748b', eyes: '#f59e0b', accent: '#334155' },

      { id: 'sr_4', name: '神蠱溫皇', rarity: 'SR', bg: '#064e3b', quote: '功名爵祿盡迷津，陪伴羽人過渡舟。', color: '#10b981', hair: '#065f46', eyes: '#34d399', accent: '#047857' },

      // S (7 Characters)
      { id: 's_1', name: '劍無極', rarity: 'S', bg: '#0c4a6e', quote: '無極劍法 ‧ 擺風式！', color: '#38bdf8', hair: '#0284c7', eyes: '#7dd3fc', accent: '#0369a1' },

      { id: 's_3', name: '千雪孤鳴', rarity: 'S', bg: '#1e1b4b', quote: '笑看江湖，狼王爪！', color: '#818cf8', hair: '#a5b4fc', eyes: '#c7d2fe', accent: '#4338ca' },
      { id: 's_4', name: '藏鏡人', rarity: 'S', bg: '#1e293b', quote: '飛瀑怒潮！', color: '#3b82f6', hair: '#fbbf24', eyes: '#60a5fa', accent: '#1d4ed8' },
      { id: 's_5', name: '風間始', rarity: 'S', bg: '#042f2e', quote: '大哥，我一定會變強！', color: '#2dd4bf', hair: '#115e59', eyes: '#5eead4', accent: '#0f766e' },
      { id: 's_6', name: '夢虬孫', rarity: 'S', bg: '#14532d', quote: '龍涎少主，興風作浪！', color: '#4ade80', hair: '#166534', eyes: '#86efac', accent: '#15803d' },
      { id: 's_7', name: '北冥封宇', rarity: 'S', bg: '#0284c7', quote: '海皇之威，澤被萬民。', color: '#38bdf8', hair: '#e0f2fe', eyes: '#7dd3fc', accent: '#0369a1' }
    ];

    /* Inventory State: heroId -> count */
    let collection = JSON.parse(localStorage.getItem('wuxia_gacha_col') || '{}');

    /* =========================================================================
       2. Q-VERSION AVATAR SVG GENERATOR (High quality styled Q-version)
       ========================================================================= */
    function generateQAvatarSVG(hero) {
      // Custom cute SVG rendering based on hero props
      return `
        <svg viewBox="0 0 100 100" class="w-full h-full drop-shadow-md">
          <circle cx="50" cy="50" r="48" fill="${hero.bg}" />
          <!-- Aura Circle -->
          <circle cx="50" cy="50" r="42" fill="none" stroke="${hero.color}" stroke-width="1.5" stroke-dasharray="4,2" opacity="0.6"/>
          
          <!-- Chibi Hair Back -->

          <!-- Chibi Head Face -->
          <circle cx="50" cy="52" r="24" fill="#ffe0bd" />

          <!-- Cute Chibi Blushes -->
          <circle cx="36" cy="58" r="4" fill="#ffb7b2" opacity="0.6" />
          <circle cx="64" cy="58" r="4" fill="#ffb7b2" opacity="0.6" />

          <!-- Big Cute Eyes -->
          <ellipse cx="40" cy="50" rx="4.5" ry="6.5" fill="#1f2937" />
          <ellipse cx="60" cy="50" rx="4.5" ry="6.5" fill="#1f2937" />
          
          <!-- Eye Catch Sparkles -->
          <circle cx="38.5" cy="48" r="2" fill="#ffffff" />
          <circle cx="58.5" cy="48" r="2" fill="#ffffff" />
          <circle cx="41.5" cy="52" r="1" fill="#ffffff" />
          <circle cx="61.5" cy="52" r="1" fill="#ffffff" />

          <!-- Eyebrows -->
          <path d="M 35 42 Q 40 40 44 42" fill="none" stroke="${hero.hair}" stroke-width="1.5" stroke-linecap="round" />
          <path d="M 56 42 Q 60 40 65 42" fill="none" stroke="${hero.hair}" stroke-width="1.5" stroke-linecap="round" />

          <!-- Mouth -->
          <path d="M 47 59 Q 50 62 53 59" fill="none" stroke="#e11d48" stroke-width="1.5" stroke-linecap="round" />

          <!-- Chibi Front Hair Fringe -->
          <path d="M 26 42 Q 35 25 50 32 Q 65 25 74 42 Q 62 30 50 38 Q 38 30 26 42 Z" fill="${hero.hair}" />

          <!-- Wuxia Forehead / Headband Ribbon / Special Trait -->
          <path d="M 28 36 Q 50 28 72 36" fill="none" stroke="${hero.color}" stroke-width="3" stroke-linecap="round"/>
          <circle cx="50" cy="32" r="3" fill="${hero.accent}" />

          <!-- Head Accessory / Small Sword Tip icon on forehead for SSR -->
          ${hero.rarity === 'SSR' ? `<polygon points="50,22 53,28 47,28" fill="#fde047" />` : ''}

    }

    /* =========================================================================
       3. GACHA DRAWING MECHANICS
       ========================================================================= */
    function getRandomHero() {
      const rand = Math.random() * 100;
      let rarity = 'S';
      
      // Rates: S: 60%, SR: 30%, SSR: 10%
      if (rand < 10) {
        rarity = 'SSR';
      } else if (rand < 40) {
        rarity = 'SR';
      } else {
        rarity = 'S';
      }

      const pool = HEROES.filter(h => h.rarity === rarity);
      const hero = pool[Math.floor(Math.random() * pool.length)];

      // Record in Collection
      collection[hero.id] = (collection[hero.id] || 0) + 1;
      localStorage.setItem('wuxia_gacha_col', JSON.stringify(collection));
      updateGalleryBadge();

      return hero;
    }

    /* =========================================================================
       4. CANVAS PARTICLE EFFECTS (S: Blue Frost, SR: Gold Rays, SSR: Rainbow Magic)
       ========================================================================= */
    const canvas = document.getElementById('fxCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let animationFrameId = null;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function triggerParticleBurst(rarity) {
      particles = [];
      const count = rarity === 'SSR' ? 120 : (rarity === 'SR' ? 80 : 50);
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;

      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 8 + 2;
        let color = '#60a5fa'; // S default

        if (rarity === 'SR') {
          color = Math.random() > 0.3 ? '#fde047' : '#f59e0b';
        } else if (rarity === 'SSR') {
          const rainbow = ['#ff0055', '#ffcc00', '#00ffcc', '#0099ff', '#ff00ff'];
          color = rainbow[Math.floor(Math.random() * rainbow.length)];
        }

        particles.push({
          x: centerX,
          y: centerY,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          radius: Math.random() * 5 + 2,
          color: color,
          alpha: 1,
          decay: Math.random() * 0.02 + 0.015
        });
      }

      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      animateParticles();
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      particles.forEach((p, idx) => {
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= p.decay;

        ctx.save();
        ctx.globalAlpha = Math.max(p.alpha, 0);
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = p.color;
        ctx.fill();
        ctx.restore();

        if (p.alpha <= 0) {
          particles.splice(idx, 1);
        }
      });

      if (particles.length > 0) {
        animationFrameId = requestAnimationFrame(animateParticles);
      }
    }

    /* =========================================================================
       5. DRAGGABLE PULL-DOWN CARD MECHANIC
       ========================================================================= */
    const pullStageModal = document.getElementById('pullStageModal');
    const draggableCard = document.getElementById('draggableCard');
    const pullDropArea = document.getElementById('pullDropArea');
    let isDragging = false;
    let startY = 0;
    let currentY = 0;
    let pendingDrawType = 'SINGLE'; // 'SINGLE' or 'TEN'

    function showPullStage(type) {
      pendingDrawType = type;
      pullStageModal.classList.remove('hidden');
      setTimeout(() => pullStageModal.classList.add('opacity-100'), 10);
      resetDraggableCard();
    }

    function hidePullStage() {
      pullStageModal.classList.remove('opacity-100');
      setTimeout(() => pullStageModal.classList.add('hidden'), 300);
    }

    function resetDraggableCard() {
      draggableCard.style.transform = `translateY(0px)`;
      draggableCard.style.transition = 'transform 0.3s ease-out';
    }

    // Touch & Mouse Event Listeners for Pull Down
    function handleStart(e) {
      isDragging = true;
      startY = e.touches ? e.touches[0].clientY : e.clientY;
      draggableCard.style.transition = 'none';
    }

    function handleMove(e) {
      if (!isDragging) return;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const deltaY = clientY - startY;

      // Allow downwards movement only
      if (deltaY > 0 && deltaY < 180) {
        currentY = deltaY;
        draggableCard.style.transform = `translateY(${deltaY}px) rotate(${deltaY * 0.05}deg)`;
      }
    }

    function handleEnd() {
      if (!isDragging) return;
      isDragging = false;

      // If pulled down far enough (> 100px), trigger draw reveal
      if (currentY > 90) {
        draggableCard.style.transition = 'transform 0.2s ease-in';
        draggableCard.style.transform = `translateY(220px)`;
        setTimeout(() => {
          hidePullStage();
          executeDraw(pendingDrawType);
        }, 200);
      } else {
        resetDraggableCard();
      }
      currentY = 0;
    }

    draggableCard.addEventListener('mousedown', handleStart);
    window.addEventListener('mousemove', handleMove);
    window.addEventListener('mouseup', handleEnd);

    draggableCard.addEventListener('touchstart', handleStart, { passive: true });
    window.addEventListener('touchmove', handleMove, { passive: true });
    window.addEventListener('touchend', handleEnd);

    document.getElementById('quickPullBtn').addEventListener('click', () => {
      hidePullStage();
      executeDraw(pendingDrawType);
    });

    document.getElementById('cancelPullBtn').addEventListener('click', hidePullStage);

    /* =========================================================================
       6. REVEAL MODAL DISPLAY LOGIC
       ========================================================================= */
    function executeDraw(type) {
      if (type === 'SINGLE') {
        const hero = getRandomHero();
        displaySingleReveal(hero);
      } else {
        const heroes = Array.from({ length: 10 }, () => getRandomHero());
        displayTenReveal(heroes);
      }
    }

    // Render Single Reveal Modal
    function displaySingleReveal(hero) {
      const modal = document.getElementById('singleRevealModal');
      const card = document.getElementById('revealedCard');
      const rarityBadge = document.getElementById('revealRarityBadge');
      const aura = document.getElementById('revealAura');
      const rarityTag = document.getElementById('cardRarityTag');
      const avatarBox = document.getElementById('cardAvatarBox');
      const heroName = document.getElementById('cardHeroName');
      const heroQuote = document.getElementById('cardHeroQuote');

      // Setup styling based on Rarity
      card.className = `w-64 h-96 rounded-2xl p-4 flex flex-col items-center justify-between relative bg-slate-950 border-4 transform transition-all duration-500 shadow-2xl overflow-hidden `;
      
      if (hero.rarity === 'S') {
        card.classList.add('glow-s');
        rarityBadge.className = 'mb-4 text-3xl font-extrabold font-calligraphy text-blue-400 drop-shadow-[0_0_15px_#3b82f6]';
        rarityBadge.innerHTML = '✦ S 級 ‧ 俠客現身 ✦';
        rarityTag.className = 'px-2.5 py-0.5 rounded text-xs font-black bg-blue-600 text-white shadow';
        rarityTag.textContent = 'S 級';
        aura.className = 'absolute w-[500px] h-[500px] rounded-full pointer-events-none ray-s animate-pulse';
      } else if (hero.rarity === 'SR') {
        card.classList.add('glow-sr');
        rarityBadge.className = 'mb-4 text-3xl font-extrabold font-calligraphy text-yellow-400 drop-shadow-[0_0_20px_#eab308]';
        rarityBadge.innerHTML = '★ SR 級 ‧ 宗師降臨 ★';
        rarityTag.className = 'px-2.5 py-0.5 rounded text-xs font-black bg-yellow-500 text-slate-950 shadow';
        rarityTag.textContent = 'SR 級';
        aura.className = 'absolute w-[550px] h-[550px] rounded-full pointer-events-none ray-sr animate-pulse';
      } else { // SSR
        card.classList.add('glow-ssr');
        rarityBadge.className = 'mb-4 text-4xl font-extrabold font-calligraphy text-ssr drop-shadow-[0_0_25px_#ec4899]';
        rarityBadge.innerHTML = '🌟 SSR 級 ‧ 傳奇絕世 🌟';
        rarityTag.className = 'px-2.5 py-0.5 rounded text-xs font-black bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500 text-white shadow';
        rarityTag.textContent = 'SSR 級';
        aura.className = 'absolute w-[650px] h-[650px] rounded-full pointer-events-none ray-ssr animate-pulse';
      }

      avatarBox.innerHTML = generateQAvatarSVG(hero);
      heroName.textContent = hero.name;
      heroQuote.textContent = `「${hero.quote}」`;

      // Trigger particle blast
      triggerParticleBurst(hero.rarity);

      modal.classList.remove('hidden');
    }

    document.getElementById('closeRevealBtn').addEventListener('click', () => {
      document.getElementById('singleRevealModal').classList.add('hidden');
    });

    // Render Ten Draws Modal
    function displayTenReveal(heroes) {
      const modal = document.getElementById('tenRevealModal');
      const grid = document.getElementById('tenCardsGrid');
      grid.innerHTML = '';

      // Check if any SSR exists for particle background
      const hasSSR = heroes.some(h => h.rarity === 'SSR');
      const hasSR = heroes.some(h => h.rarity === 'SR');
      if (hasSSR) triggerParticleBurst('SSR');
      else if (hasSR) triggerParticleBurst('SR');

      heroes.forEach((hero, index) => {
        const cardElem = document.createElement('div');
        let glowClass = hero.rarity === 'SSR' ? 'glow-ssr' : (hero.rarity === 'SR' ? 'glow-sr' : 'glow-s');
        let rarityBg = hero.rarity === 'SSR' ? 'bg-pink-600 text-white' : (hero.rarity === 'SR' ? 'bg-yellow-500 text-slate-950' : 'bg-blue-600 text-white');

        cardElem.className = `w-36 h-56 rounded-xl p-2 bg-slate-900 border-2 ${glowClass} flex flex-col items-center justify-between relative cursor-pointer transform hover:scale-105 transition duration-300 shadow-lg`;
        
        cardElem.innerHTML = `
          <div class="w-full flex justify-between items-center text-[10px]">
            <span class="px-1.5 py-0.5 rounded font-black ${rarityBg}">${hero.rarity}</span>
            <span class="text-slate-400 font-calligraphy">金光</span>
          </div>
          <div class="w-20 h-20 rounded-full flex items-center justify-center overflow-hidden border border-white/20">
            ${generateQAvatarSVG(hero)}
          </div>
          <div class="w-full text-center bg-black/40 py-1 rounded">
            <div class="text-sm font-bold font-calligraphy text-white">${hero.name}</div>
          </div>
        `;

        // Click on 10x item to show detailed modal
        cardElem.addEventListener('click', () => displaySingleReveal(hero));
        grid.appendChild(cardElem);
      });

      modal.classList.remove('hidden');
    }

    document.getElementById('closeTenBtn').addEventListener('click', () => {
      document.getElementById('tenRevealModal').classList.add('hidden');
    });

    document.getElementById('drawTenAgainBtn').addEventListener('click', () => {
      document.getElementById('tenRevealModal').classList.add('hidden');
      showPullStage('TEN');
    });

    /* =========================================================================
       7. GALLERY & COLLECTION LOGIC
       ========================================================================= */
    function updateGalleryBadge() {
      const ownedKeys = Object.keys(collection).filter(k => collection[k] > 0);
      document.getElementById('galleryCountBadge').textContent = `${ownedKeys.length}/${HEROES.length}`;
      document.getElementById('collectedCountText').textContent = ownedKeys.length;
    }

    function renderGallery(filter = 'ALL') {
      const grid = document.getElementById('galleryGrid');
      grid.innerHTML = '';

      const filtered = HEROES.filter(h => filter === 'ALL' || h.rarity === filter);

      filtered.forEach(hero => {
        const count = collection[hero.id] || 0;
        const isOwned = count > 0;
        
        const item = document.createElement('div');
        let borderGlow = isOwned 
          ? (hero.rarity === 'SSR' ? 'glow-ssr' : (hero.rarity === 'SR' ? 'glow-sr' : 'glow-s'))
          : 'border-slate-800 opacity-50 grayscale';

        item.className = `h-56 rounded-xl p-2 bg-slate-900/90 border-2 ${borderGlow} flex flex-col items-center justify-between relative transition duration-300 hover:scale-105`;
        
        item.innerHTML = `
          <div class="w-full flex justify-between items-center text-[10px]">
            <span class="px-1.5 py-0.5 rounded font-black ${hero.rarity === 'SSR' ? 'bg-pink-600 text-white' : (hero.rarity === 'SR' ? 'bg-yellow-500 text-slate-950' : 'bg-blue-600 text-white')}">${hero.rarity}</span>
            <span class="text-xs ${isOwned ? 'text-amber-300 font-bold' : 'text-slate-500'}">已得 ${count} 張</span>
          </div>

          <div class="w-20 h-20 rounded-full flex items-center justify-center overflow-hidden border border-white/10 ${!isOwned ? 'brightness-50' : ''}">
            ${generateQAvatarSVG(hero)}
          </div>

          <div class="w-full text-center bg-black/60 py-1 rounded">
            <div class="text-sm font-bold font-calligraphy text-amber-200">${hero.name}</div>
            <div class="text-[9px] text-slate-400 ${!isOwned ? 'hidden' : ''}">「${hero.quote.substring(0, 10)}...」</div>
          </div>
        `;

        if (isOwned) {
          item.addEventListener('click', () => displaySingleReveal(hero));
        }

        grid.appendChild(item);
      });
    }

    // Gallery Modal Controls
    const galleryModal = document.getElementById('galleryModal');
    document.getElementById('openGalleryBtn').addEventListener('click', () => {
      renderGallery('ALL');
      galleryModal.classList.remove('hidden');
    });
    document.getElementById('closeGalleryBtn').addEventListener('click', () => {
      galleryModal.classList.add('hidden');
    });

    // Gallery Tabs
    document.querySelectorAll('.gallery-tab').forEach(tab => {
      tab.addEventListener('click', (e) => {
        document.querySelectorAll('.gallery-tab').forEach(t => {
          t.classList.remove('active-tab', 'text-amber-400', 'border-b-2', 'border-amber-400');
          t.classList.add('text-slate-400');
        });
        e.target.classList.add('active-tab', 'text-amber-400', 'border-b-2', 'border-amber-400');
        e.target.classList.remove('text-slate-400');
        renderGallery(e.target.dataset.filter);
      });
    });

    /* =========================================================================
       8. BUTTON BINDINGS & INIT
       ========================================================================= */
    document.getElementById('deckAltar').addEventListener('click', () => showPullStage('SINGLE'));
    document.getElementById('drawOneBtn').addEventListener('click', () => showPullStage('SINGLE'));
    document.getElementById('drawTenBtn').addEventListener('click', () => showPullStage('TEN'));

    // Initialize Page State
    updateGalleryBadge();
  </script>
